<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Quest Sync - Family Rewards & Tasks</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <meta name="theme-color" content="#f59e0b" />
  <script>
    window.addEventListener('error', function(e) {
      var root = document.getElementById('root');
      if (root && !root.querySelector('.app-loaded')) {
        root.innerHTML = '<div style="padding:30px;color:#ef4444;background:#18181b;min-height:100vh;font-family:system-ui,sans-serif;">' +
          '<h2 style="font-size:20px;font-weight:bold;margin-bottom:10px;">App Startup Error</h2>' +
          '<p style="font-size:14px;color:#fca5a5;margin-bottom:15px;">An error occurred while loading the app:</p>' +
          '<pre style="background:#27272a;padding:15px;border-radius:8px;font-size:12px;white-space:pre-wrap;word-break:break-all;color:#fee2e2;">' +
          (e.error ? (e.error.stack || e.error.message) : e.message) +
          '</pre></div>';
      }
    });
    window.addEventListener('unhandledrejection', function(e) {
      var root = document.getElementById('root');
      if (root && !root.querySelector('.app-loaded')) {
        root.innerHTML = '<div style="padding:30px;color:#ef4444;background:#18181b;min-height:100vh;font-family:system-ui,sans-serif;">' +
          '<h2 style="font-size:20px;font-weight:bold;margin-bottom:10px;">Unhandled Rejection</h2>' +
          '<pre style="background:#27272a;padding:15px;border-radius:8px;font-size:12px;white-space:pre-wrap;word-break:break-all;color:#fee2e2;">' +
          (e.reason ? (e.reason.stack || e.reason.message || String(e.reason)) : 'Unknown rejection') +
          '</pre></div>';
      }
    });
  </script>
</head>

<body style="background-color: #0c0a09; margin: 0;">
  <div id="root">
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #0c0a09; color: #ffffff; font-family: system-ui, sans-serif;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
        <div style="width: 40px; height: 40px; border: 4px solid #10b981; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <p style="font-size: 14px; color: #a8a29e; font-weight: 500; margin: 0;">Loading Reward Chart...</p>
      </div>
    </div>
    <style>
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
